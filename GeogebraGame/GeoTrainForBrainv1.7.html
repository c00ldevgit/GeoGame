<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#f8fafc">
<title>GeoGebra Math Game</title>
<script src="/socket.io/socket.io.js"></script>
<style>
:root {
    color-scheme: light;
    --primary: #4f46e5; --primary-hover: #4338ca; --primary-light: #e0e7ff;
    --success: #10b981; --success-bg: #ecfdf5;
    --danger: #ef4444; --danger-bg: #fef2f2;
    --gold: #f59e0b; --gold-light: #fef3c7;
    --bg-color: #f8fafc; --card-bg: #ffffff;
    --text-main: #1e293b; --text-muted: #64748b; --border-color: #e2e8f0;
    --radius-sm: 8px; --radius-md: 12px; --radius-lg: 16px;
    --shadow-sm: 0 1px 2px 0 rgba(0,0,0,0.05);
    --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -2px rgba(0,0,0,0.1);
    --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.1), 0 4px 6px -4px rgba(0,0,0,0.1);
}
body.dark {
    color-scheme: dark;
    --bg-color: #0f172a; --card-bg: #1e293b;
    --text-main: #f1f5f9; --text-muted: #94a3b8; --border-color: #334155;
    --primary-light: #312e81; --success-bg: #064e3b; --danger-bg: #7f1d1d;
    --gold-light: #78350f;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background-color: var(--bg-color); color: var(--text-main);
    height: 100%; width: 100%; overflow: hidden;
    transition: background-color 0.25s, color 0.25s;
}
.screen { display: none; width: 100vw; height: 100vh; position: fixed; top:0; left:0; background-color: var(--bg-color); }
.screen.active { display: flex; }

.coin-badge {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--gold-light); border: 2px solid var(--gold); color: #92400e;
    padding: 8px 16px; border-radius: 999px; font-weight: 800; font-size: 1rem;
    box-shadow: var(--shadow-sm);
}
body.dark .coin-badge { color: #fbbf24; }
.coin-badge .coin-icon { font-size: 1.15rem; }

#mainMenu { justify-content: center; align-items: center; flex-direction: column; gap: 10px; padding: 24px; overflow-y: auto; }
.ggb-logo { font-size: 2.4rem; font-weight: 800; color: #d97706; margin-bottom: 4px; text-align: center; letter-spacing: -0.025em; }
.ggb-logo span { color: var(--primary); }

.menu-btn {
    background-color: var(--card-bg); border: 2px solid var(--border-color); color: var(--text-main);
    padding: 13px 22px; font-size: 0.98rem; font-weight: 600; border-radius: var(--radius-md);
    cursor: pointer; width: 100%; max-width: 360px; text-align: center;
    transition: all 0.2s; box-shadow: var(--shadow-sm);
}
.menu-btn:hover { border-color: var(--primary); transform: translateY(-2px); box-shadow: var(--shadow-md); }
.menu-btn:active { transform: scale(0.98); }
.menu-btn.primary { background-color: var(--primary); border-color: var(--primary); color: #fff; }
.menu-btn.accent { background-color: #10b981; border-color: #10b981; color: #fff; }
.menu-btn.gold { background-color: var(--gold); border-color: var(--gold); color: #fff; }
.menu-btn.purple { background: linear-gradient(135deg, #7c3aed, #a855f7); border-color: #7c3aed; color: #fff; }
.menu-btn.ghost { background: transparent; border-color: var(--border-color); color: var(--text-muted); }
.menu-btn:disabled, .menu-btn.disabled { opacity: 0.4; cursor: not-allowed; transform: none !important; }

.modal-overlay {
    position: fixed; top:0; left:0; width: 100vw; height: 100vh;
    background: rgba(15,23,42,0.7); backdrop-filter: blur(4px);
    z-index: 1000; display: none; justify-content: center; align-items: center; padding: 20px;
}
.modal-overlay.active { display: flex; }
.modal-card {
    background: var(--card-bg); color: var(--text-main);
    width: 100%; max-width: 520px; border-radius: var(--radius-lg);
    padding: 26px; box-shadow: var(--shadow-lg); display: flex; flex-direction: column; gap: 16px;
    animation: modalPop 0.3s cubic-bezier(0.34,1.56,0.64,1);
    max-height: 90vh; overflow-y: auto;
}
@keyframes modalPop { 0% { transform: scale(0.9); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
.modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 12px; }

.list-screen { flex-direction: column; padding: 20px; align-items: center; overflow-y: auto; }
.list-screen header { width: 100%; max-width: 900px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; gap: 12px; flex-wrap: wrap; }
.levels-wrapper { max-width: 900px; width: 100%; display: flex; flex-direction: column; gap: 20px; padding-bottom: 40px; }
.category-title { font-size: 1.05rem; font-weight: 700; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; border-bottom: 2px solid var(--border-color); padding-bottom: 8px; flex-wrap: wrap; }
.category-title.easy { color: #059669; }
.category-title.medium { color: #d97706; }
.category-title.hard { color: var(--danger); }
.category-title.expert { color: #7c3aed; }
.category-title.custom { color: #7c3aed; }
.levels-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }
.level-card {
    background: var(--card-bg); border: 1px solid var(--border-color); border-radius: var(--radius-md);
    padding: 16px; cursor: pointer; box-shadow: var(--shadow-sm); transition: all 0.2s ease; position: relative;
}
.level-card:hover { border-color: var(--primary); transform: translateY(-2px); box-shadow: var(--shadow-md); }
.level-card h3 { color: var(--primary); margin-bottom: 6px; font-size: 0.95rem; }
.level-card p { color: var(--text-muted); font-size: 0.82rem; line-height: 1.4; }
.level-card .level-meta { display: flex; gap: 10px; font-size: 0.72rem; color: var(--text-muted); margin-top: 10px; padding-top: 8px; border-top: 1px dashed var(--border-color); flex-wrap: wrap; }
.level-card.completed { border-color: #86efac; background: linear-gradient(135deg, var(--card-bg) 0%, var(--success-bg) 100%); }
.completed-badge { position: absolute; top: -10px; right: -10px; background: var(--success); color: #fff; padding: 4px 10px; border-radius: 999px; font-size: 0.7rem; font-weight: 800; }
.locked-badge { position: absolute; top: -10px; right: -10px; background: #64748b; color: #fff; padding: 4px 10px; border-radius: 999px; font-size: 0.72rem; font-weight: 800; }
.reward-badge { display: inline-block; background: var(--gold-light); color: #92400e; padding: 2px 8px; border-radius: 999px; font-size: 0.7rem; font-weight: 700; }
.reward-badge.done { background: var(--border-color); color: var(--text-muted); }
.level-card.locked { opacity: 0.55; cursor: not-allowed; background: var(--bg-color); filter: grayscale(0.6); }
.level-card.locked:hover { transform: none; box-shadow: var(--shadow-sm); border-color: var(--border-color); }
.level-card.locked h3 { color: var(--text-muted); }

.workspace-screen { flex-direction: row; }
@media (max-width: 768px) { .workspace-screen { flex-direction: column-reverse; } }
.algebra-panel { width: 420px; background: var(--card-bg); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; height: 100%; z-index: 10; box-shadow: var(--shadow-sm); }
@media (max-width: 768px) { .algebra-panel { width: 100%; height: 48vh; border-right: none; border-top: 1px solid var(--border-color); } }
.ggb-toolbar { height: 50px; background: var(--card-bg); border-bottom: 1px solid var(--border-color); display: flex; align-items: center; padding: 0 12px; gap: 8px; flex-shrink: 0; }
.ggb-toolbar .spacer { flex: 1; }
.icon-btn { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: var(--radius-sm); padding: 8px 12px; cursor: pointer; font-size: 0.88rem; font-weight: 500; color: var(--text-main); transition: background 0.15s; }
.icon-btn:hover { background: var(--bg-color); }
.algebra-content { flex: 1; padding: 14px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
.input-row { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: var(--radius-sm); padding: 10px 12px; display: flex; align-items: center; gap: 8px; transition: border-color 0.15s, box-shadow 0.15s; }
.input-row:focus-within { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-light); }
.input-row label { font-weight: 600; color: var(--primary); font-family: serif; font-style: italic; font-size: 1.1rem; }
.input-row input { border: none; outline: none; font-size: 1.05rem; width: 100%; font-family: ui-monospace, monospace; color: var(--text-main); background: transparent; }
.delete-btn { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 1.25rem; padding: 2px 6px; border-radius: 4px; }
.add-btn { background-color: var(--card-bg); border: 2px dashed var(--border-color); color: var(--text-muted); padding: 12px; font-size: 0.95rem; font-weight: 600; border-radius: var(--radius-sm); cursor: pointer; text-align: center; }
.math-keyboard { background: var(--bg-color); border-top: 1px solid var(--border-color); padding: 10px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; flex-shrink: 0; }
.math-key { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: var(--radius-sm); padding: 10px 0; font-size: 0.95rem; font-weight: 600; color: var(--text-main); cursor: pointer; text-align: center; }
.level-description { background: var(--primary-light); border-left: 4px solid var(--primary); padding: 12px 14px; border-radius: 0 var(--radius-sm) var(--radius-sm) 0; font-size: 0.88rem; color: var(--text-main); line-height: 1.45; }
.status-box { padding: 12px; border-radius: var(--radius-sm); font-weight: 600; font-size: 0.92rem; text-align: center; }
.status-box.success { background: var(--success-bg); color: #065f46; border: 1px solid #a7f3d0; }
.status-box.fail { background: var(--danger-bg); color: #991b1b; border: 1px solid #fecaca; }
.status-box.neutral { background: var(--bg-color); color: var(--text-muted); border: 1px solid var(--border-color); }
body.dark .status-box.success { color: #6ee7b7; }
body.dark .status-box.fail { color: #fca5a5; }
.hint-footer { color: var(--text-muted); font-size: 0.78rem; line-height: 1.4; margin-top: auto; }
.hint-footer code { background: var(--bg-color); padding: 1px 5px; border-radius: 3px; font-family: ui-monospace, monospace; }

.graphics-view { flex: 1; height: 100%; position: relative; background: #fff; touch-action: none; overflow: hidden; transition: height 0.25s ease; }
body.dark .graphics-view { background: #0f172a; }
@media (max-width: 768px) {
    .graphics-view { height: 52vh; }
    body.input-focused .graphics-view,
    body.keyboard-open .graphics-view { height: 32vh; }
    body.input-focused .hint-footer,
    body.keyboard-open .hint-footer { display: none; }
}
canvas { display: block; width: 100%; height: 100%; cursor: crosshair; }

.coord-tooltip { position: absolute; background: rgba(30,41,59,0.95); color: #fff; padding: 6px 12px; border-radius: var(--radius-sm); font-family: ui-monospace, monospace; font-size: 0.85rem; font-weight: 700; pointer-events: none; transform: translate(-50%,-140%); white-space: nowrap; opacity: 0; transition: opacity 0.1s; z-index: 50; box-shadow: var(--shadow-md); }
.coord-tooltip.show { opacity: 1; }
.coord-tag { display: inline-block; font-size: 0.7rem; padding: 1px 5px; border-radius: 3px; margin-left: 6px; font-weight: 700; }
.coord-tag.on-line { background: var(--primary); color: #fff; }
.coord-tag.on-target { background: var(--success); color: #fff; }
.coord-tag.on-obstacle { background: var(--danger); color: #fff; }

.zoom-controls { position: absolute; right: 16px; bottom: 16px; display: flex; flex-direction: column; gap: 6px; background: var(--card-bg); border: 1px solid var(--border-color); border-radius: var(--radius-md); box-shadow: var(--shadow-md); overflow: hidden; }
.zoom-btn { background: var(--card-bg); border: none; width: 42px; height: 42px; font-size: 1.2rem; cursor: pointer; color: var(--text-main); }
.zoom-btn:hover { background: var(--bg-color); }

.shop-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; width: 100%; max-width: 900px; }
.shop-item { background: var(--card-bg); border: 2px solid var(--border-color); border-radius: var(--radius-md); padding: 16px; display: flex; flex-direction: column; gap: 8px; }
.shop-item.owned { border-color: #86efac; }
.shop-item .item-icon { font-size: 1.8rem; text-align: center; }
.shop-item h4 { font-size: 0.95rem; text-align: center; }
.shop-item .item-desc { font-size: 0.78rem; color: var(--text-muted); text-align: center; min-height: 34px; }
.shop-item .item-preview { height: 36px; display: flex; align-items: center; justify-content: center; background: var(--bg-color); border-radius: var(--radius-sm); }
.shop-item .preview-line { width: 60%; height: 4px; border-radius: 2px; }
.shop-item .buy-btn { padding: 9px; border-radius: var(--radius-sm); font-weight: 700; font-size: 0.85rem; border: none; cursor: pointer; }
.shop-item .buy-btn.affordable { background: var(--gold); color: #fff; }
.shop-item .buy-btn.expensive { background: var(--border-color); color: var(--text-muted); cursor: not-allowed; }
.shop-item .buy-btn.owned-btn { background: var(--success); color: #fff; }
.shop-item .buy-btn.equip-btn { background: var(--primary); color: #fff; }
.shop-item .buy-btn.equipped-btn { background: var(--border-color); color: var(--text-muted); cursor: default; }

.player-bar { display: flex; align-items: center; gap: 10px; background: var(--card-bg); border: 2px solid var(--border-color); border-radius: var(--radius-md); padding: 12px 16px; box-shadow: var(--shadow-sm); max-width: 380px; width: 100%; justify-content: space-between; }
.player-bar .progress-info { display: flex; flex-direction: column; gap: 4px; flex: 1; }
.player-bar .progress-text { font-size: 0.75rem; font-weight: 700; color: var(--text-muted); }
.player-bar .progress-track { width: 100%; height: 6px; background: var(--border-color); border-radius: 999px; overflow: hidden; }
.player-bar .progress-fill { height: 100%; background: linear-gradient(90deg, var(--success), #34d399); border-radius: 999px; transition: width 0.4s ease; }

.toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-100px); background: var(--text-main); color: #fff; padding: 14px 22px; border-radius: var(--radius-md); font-weight: 700; font-size: 0.92rem; box-shadow: var(--shadow-lg); z-index: 2000; transition: transform 0.35s cubic-bezier(0.34,1.56,0.64,1); max-width: 90vw; text-align: center; }
.toast.show { transform: translateX(-50%) translateY(0); }
.toast.reward { background: linear-gradient(135deg, var(--gold), #d97706); }
.toast.fail { background: linear-gradient(135deg, var(--danger), #b91c1c); }

.achievements-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; width: 100%; max-width: 900px; }
.ach-card { background: var(--card-bg); border: 2px solid var(--border-color); border-radius: var(--radius-md); padding: 14px; display: flex; gap: 10px; align-items: center; }
.ach-card.unlocked { border-color: var(--gold); background: linear-gradient(135deg, var(--card-bg) 0%, var(--gold-light) 100%); }
.ach-card.locked { opacity: 0.55; filter: grayscale(0.5); }
.ach-icon { font-size: 1.8rem; flex-shrink: 0; }
.ach-info h4 { font-size: 0.9rem; }
.ach-info p { font-size: 0.75rem; color: var(--text-muted); line-height: 1.3; }
.ach-reward { font-size: 0.7rem; color: var(--gold); font-weight: 700; margin-top: 2px; }

.stats-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; width: 100%; max-width: 900px; }
.stat-card { background: var(--card-bg); border: 2px solid var(--border-color); border-radius: var(--radius-md); padding: 16px; text-align: center; }
.stat-card .stat-value { font-size: 1.6rem; font-weight: 800; color: var(--primary); }
.stat-card .stat-label { font-size: 0.75rem; color: var(--text-muted); margin-top: 4px; font-weight: 600; }

.color-palette { display: grid; grid-template-columns: repeat(8, 1fr); gap: 8px; }
.color-swatch { aspect-ratio: 1; border-radius: var(--radius-sm); border: 3px solid transparent; cursor: pointer; }
.color-swatch.selected { border-color: var(--primary); transform: scale(1.1); }

.export-area { width: 100%; min-height: 120px; font-family: ui-monospace, monospace; font-size: 0.78rem; padding: 12px; border: 1px solid var(--border-color); border-radius: var(--radius-sm); background: var(--bg-color); color: var(--text-main); resize: vertical; }
.daily-gift { font-size: 4.5rem; animation: bounceIn 0.6s; text-align: center; }
@keyframes bounceIn { 0% { transform: scale(0); } 60% { transform: scale(1.2); } 100% { transform: scale(1); } }
.expert-banner { background: linear-gradient(135deg, #7c3aed, #a855f7); color: #fff; padding: 10px 14px; border-radius: var(--radius-sm); font-size: 0.78rem; font-weight: 600; line-height: 1.4; }
.lang-switcher { position: fixed; top: 12px; right: 12px; z-index: 900; display: flex; gap: 4px; background: var(--card-bg); border: 2px solid var(--border-color); border-radius: 999px; padding: 3px; box-shadow: var(--shadow-md); }
.lang-btn { background: transparent; border: none; padding: 6px 10px; border-radius: 999px; cursor: pointer; font-size: 0.8rem; font-weight: 700; color: var(--text-muted); }
.lang-btn.active { background: var(--primary); color: #fff; }

@keyframes spin { 0% { transform: rotate(0); } 100% { transform: rotate(360deg); } }
.spin { animation: spin 2s linear infinite; display: inline-block; }

.mp-opp-block { background: #fef2f2; border-radius: var(--radius-sm); padding: 10px; border-left: 4px solid var(--danger); }
body.dark .mp-opp-block { background: #3f1f1f; }
.mp-my-block { background: var(--primary-light); border-radius: var(--radius-sm); padding: 10px; border-left: 4px solid var(--primary); }
.mp-block-label { font-size: 0.68rem; font-weight: 700; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
.mp-scores { display: flex; justify-content: space-between; padding: 8px; background: var(--bg-color); border-radius: var(--radius-sm); font-size: 0.82rem; font-weight: 700; }
</style>
</head>
<body>

<div class="lang-switcher">
    <button class="lang-btn" id="langBtnRu" onclick="setLanguage('ru')">RU</button>
    <button class="lang-btn" id="langBtnEn" onclick="setLanguage('en')">EN</button>
</div>

<div id="toast" class="toast"></div>

<!-- DAILY BONUS -->
<div id="dailyBonusModal" class="modal-overlay">
    <div class="modal-card" style="text-align:center;">
        <div class="daily-gift">🎁</div>
        <h2 id="dailyTitle" style="color: var(--gold); font-size:1.3rem;"></h2>
        <p id="dailyDesc" style="color: var(--text-muted);"></p>
        <div class="coin-badge" style="align-self:center; font-size:1.2rem; padding: 12px 24px;">
            <span class="coin-icon" style="font-size:1.5rem;">🪙</span><span>+100</span>
        </div>
        <button class="menu-btn primary" style="max-width:none;" onclick="claimDailyBonus()" data-i18n="dailyClaim"></button>
    </div>
</div>

<!-- TUTORIAL -->
<div id="tutorialModal" class="modal-overlay">
    <div class="modal-card">
        <div class="modal-header">
            <h3 id="tutTitle"></h3>
            <span id="tutStepIndicator" style="font-size:0.82rem; color: var(--text-muted);"></span>
        </div>
        <div id="tutBody" style="font-size:0.95rem; line-height:1.6; min-height:120px;"></div>
        <div style="display: flex; justify-content: space-between; gap:10px;">
            <button class="icon-btn" onclick="closeTutorial()" data-i18n="skip"></button>
            <div style="display: flex; gap:8px;">
                <button class="icon-btn" id="tutPrevBtn" onclick="prevTutorialStep()" data-i18n="prev"></button>
                <button class="menu-btn primary" id="tutNextBtn" onclick="nextTutorialStep()" style="padding:8px 20px; font-size:0.92rem; width:auto; max-width:none;"></button>
            </div>
        </div>
    </div>
</div>

<!-- LEVEL COMPLETE -->
<div id="levelCompleteModal" class="modal-overlay">
    <div class="modal-card" style="text-align:center;">
        <div style="font-size: 3rem;">🎉</div>
        <div id="completeTitleText" style="font-size:1.4rem; font-weight:800; color: var(--success);"></div>
        <div id="completeLevelName" style="font-size:0.95rem; color: var(--text-muted); font-weight:600;"></div>
        <div style="background: var(--bg-color); border: 1px dashed var(--border-color); border-radius: var(--radius-sm); padding: 12px; font-family: ui-monospace, monospace; font-size: 0.92rem; text-align: left;">
            <div id="yourSolutionLabel" style="font-size:0.68rem; color: var(--text-muted); font-weight:700; text-transform:uppercase; margin-bottom:4px;"></div>
            f(x) = <span id="completeSolution" style="color: var(--primary); font-weight:700;"></span>
        </div>
        <div id="completeReward" class="coin-badge" style="align-self:center; padding: 12px 22px; font-size:1.05rem;">
            <span class="coin-icon" style="font-size:1.3rem;">🪙</span>
            <span id="receivedLabel"></span>
            <span id="completeRewardAmount"></span>
        </div>
        <div style="display: flex; gap: 10px;">
            <button class="menu-btn ghost" id="btnPrevLevel" onclick="goToPrevLevel()" style="flex:1; padding: 12px;" data-i18n="prevLevel"></button>
            <button class="menu-btn primary" id="btnNextLevel" onclick="goToNextLevel()" style="flex:1; padding: 12px;" data-i18n="nextLevel"></button>
        </div>
        <div style="display: flex; gap: 10px;">
            <button class="menu-btn" onclick="closeLevelComplete()" style="flex:1; padding: 12px;" data-i18n="toLevels"></button>
            <button class="menu-btn accent" onclick="retryLevel()" style="flex:1; padding: 12px;" data-i18n="retry"></button>
        </div>
    </div>
</div>

<!-- SETTINGS -->
<div id="settingsModal" class="modal-overlay">
    <div class="modal-card">

let currentLang = loadJSON('ggb_lang', null) || (navigator.language && navigator.language.startsWith('ru') ? 'ru' : 'en');
function t(key) { return I18N[currentLang][key] !== undefined ? I18N[currentLang][key] : key; }

function applyTranslations() {
    document.querySelectorAll('[data-i18n]').forEach(el => {
        const val = I18N[currentLang][el.getAttribute('data-i18n')];
        if (typeof val === 'string') el.textContent = val;
    });
    document.getElementById('langBtnRu').classList.toggle('active', currentLang === 'ru');
    document.getElementById('langBtnEn').classList.toggle('active', currentLang === 'en');
    document.getElementById('dailyTitle').textContent = t('dailyTitle');
    document.getElementById('dailyDesc').textContent = t('dailyDesc');
    document.getElementById('gameHintFooter').innerHTML = t('hintFooter');
    document.getElementById('yourSolutionLabel').textContent = t('yourSolution');
    document.getElementById('receivedLabel').textContent = t('received');
    document.getElementById('completeTitleText').textContent = t('statusPassed');
    const calcBtn = document.getElementById('freeCalcModeBtn');
    if (calcBtn) calcBtn.textContent = freeCalcTargetMode ? t('targetsModeOn') : t('targetsModeOff');
    updateThemeButton();
    updateCoinDisplays();
}
function setLanguage(lang) {
    if (lang !== 'ru' && lang !== 'en') return;
    currentLang = lang;
    saveJSON('ggb_lang', lang);
    applyTranslations();
    if (document.getElementById('levelsScreen').classList.contains('active')) renderLevelsList();
    if (document.getElementById('expertScreen').classList.contains('active')) renderExpertList();
    if (document.getElementById('editorMenuScreen').classList.contains('active')) renderCustomLevelsList();
    if (document.getElementById('shopScreen').classList.contains('active')) renderShop();
}

function checkAchievements() {
    let newly = [];
    ACHIEVEMENTS.forEach(ach => {
        if (playerData.achievements.includes(ach.id)) return;
        if (ach.check(playerData)) {
            playerData.achievements.push(ach.id);
            playerData.coins += ach.reward;
            newly.push(ach);
        }
    });
    if (newly.length > 0) {
        savePlayer(); updateCoinDisplays();
        newly.forEach((ach, i) => setTimeout(() => showToast(`🏆 ${t('achNames')[ach.id].name}! +${ach.reward} 🪙`, 'reward'), i * 800));
    }
}

function openShop() { showScreen('shopScreen'); renderShop(); }
function renderShop() {
    const c = document.getElementById('shopContainer');
    c.innerHTML = '';
    SHOP_ITEMS.forEach(item => {
        const meta = t('shopItems')[item.id];
        const owned = playerData.inventory.includes(item.id);
        const equipped = (item.type === 'skin' && playerData.equipped.skin === item.id) || (item.type === 'theme' && playerData.equipped.theme === item.id);
        const canAfford = playerData.coins >= item.price;
        const div = document.createElement('div');
        div.className = 'shop-item' + (owned && !item.consumable ? ' owned' : '');
        let prev = '';
        if (item.type === 'skin') prev = `<div class="item-preview"><div class="preview-line" style="background:${item.preview.color}; height:${item.preview.width}px;"></div></div>`;
        else if (item.type === 'theme') prev = `<div class="item-preview" style="background:${item.preview.bg}; color:${item.preview.color};">Aa 123</div>`;
        else prev = `<div class="item-preview" style="font-size:1.4rem;">${item.icon}</div>`;
        let btn;
        if (item.consumable) btn = canAfford ? `<button class="buy-btn affordable" onclick="buyItem('${item.id}')">${t('shopBuy')} · 🪙 ${item.price}</button>` : `<button class="buy-btn expensive" disabled>${t('shopNeed')} 🪙 ${item.price}</button>`;
        else if (owned) {
            if (item.type === 'custom_skin') btn = `<button class="buy-btn equip-btn" onclick="openSkinCustomizer()">${t('shopCustomize')}</button>`;
            else if (equipped) btn = `<button class="buy-btn equipped-btn" disabled>${t('shopWorn')}</button>`;
            else btn = `<button class="buy-btn equip-btn" onclick="equipItem('${item.id}', '${item.type}')">${t('shopWear')}</button>`;
        } else btn = canAfford ? `<button class="buy-btn affordable" onclick="buyItem('${item.id}')">${t('shopBuy')} · 🪙 ${item.price}</button>` : `<button class="buy-btn expensive" disabled>${t('shopNeed')} 🪙 ${item.price}</button>`;
        div.innerHTML = `<div class="item-icon">${item.icon}</div><h4>${meta.name}</h4><div class="item-desc">${meta.desc}</div>${prev}${btn}`;
        c.appendChild(div);
    });
}
function buyItem(id) {
    const item = SHOP_ITEMS.find(i => i.id === id);

/* ============================================================
   PARSER
============================================================ */
const FORMULA_PATTERNS = [
    [/\bsin\b/g, 'Math.sin'], [/\bcos\b/g, 'Math.cos'], [/\btan\b/g, 'Math.tan'],
    [/\bsqrt\b/g, 'Math.sqrt'], [/\babs\b/g, 'Math.abs'], [/\blog\b/g, 'Math.log'],
    [/\bexp\b/g, 'Math.exp'], [/\bpi\b/g, 'Math.PI'], [/\^/g, '**']
];
function parseFormula(raw) {
    let s = raw;
    for (const [re, rep] of FORMULA_PATTERNS) s = s.replace(re, rep);
    return s;
}
function compileFunction(raw) {
    try { const fn = new Function('x', 'return ' + parseFormula(raw) + ';'); fn(1); return fn; }
    catch (e) { return null; }
}

/* ============================================================
   GEOMETRY
============================================================ */
function worldToScreen(mx, my, ox, oy, s) { return { x: ox + mx * s, y: oy - my * s }; }
function screenToWorld(px, py, ox, oy, s) { return { x: (px - ox) / s, y: (oy - py) / s }; }
function distanceToSegment(px, py, x1, y1, x2, y2) {
    const dx = x2 - x1, dy = y2 - y1, lenSq = dx * dx + dy * dy;
    if (lenSq === 0) return Math.hypot(px - x1, py - y1);
    let t2 = ((px - x1) * dx + (py - y1) * dy) / lenSq;
    t2 = Math.max(0, Math.min(1, t2));
    return Math.hypot(px - (x1 + t2 * dx), py - (y1 + t2 * dy));
}
function getTargets(level) {
    if (level.targets) return level.targets;
    if (level.target) return [level.target];
    return [];
}

let victoryAnimStart = null;

/* ============================================================
   DRAWING
============================================================ */
function drawLinePath(ctx, fn, ox, oy, scale, w, h) {
    let drawing = false, prevPy = 0;
    const PAD = CONFIG.JUMP_THRESHOLD, JUMP = CONFIG.JUMP_THRESHOLD;
    for (let px = 0; px <= w; px += 1) {
        const mx = (px - ox) / scale;
        let my;
        try { my = fn(mx); } catch (e) { drawing = false; continue; }
        if (isNaN(my) || !isFinite(my)) { drawing = false; continue; }
        const py = oy - my * scale;
        if (drawing && Math.abs(py - prevPy) > JUMP) drawing = false;
        const c = Math.max(-PAD, Math.min(h + PAD, py));
        if (!drawing) { ctx.moveTo(px, c); drawing = true; } else ctx.lineTo(px, c);
        prevPy = py;
    }
}
function drawFunctionLine(ctx, fn, ox, oy, scale, color, width, w, h) {
    const isVictory = victoryAnimStart !== null;
    if (isVictory) {
        const elapsed = Date.now() - victoryAnimStart;
        const progress = Math.min(elapsed / CONFIG.VICTORY_DURATION, 1);
        const pulse = Math.sin(progress * Math.PI * 6);
        const intensity = Math.abs(pulse);
        ctx.save();
        ctx.shadowColor = CONFIG.VICTORY_NEON;
        ctx.shadowBlur = 25 + intensity * 25;
        ctx.strokeStyle = `rgba(0, 212, 255, ${0.4 + intensity * 0.5})`;
        ctx.lineWidth = width + 6 + intensity * 6;
        ctx.lineCap = 'round'; ctx.lineJoin = 'round';
        ctx.beginPath(); drawLinePath(ctx, fn, ox, oy, scale, w, h); ctx.stroke();
        ctx.restore();
        ctx.save();
        ctx.shadowColor = CONFIG.VICTORY_NEON;
        ctx.shadowBlur = 12 + intensity * 10;
        ctx.strokeStyle = `rgba(0, 212, 255, ${0.6 + intensity * 0.4})`;
        ctx.lineWidth = width + 3;
        ctx.lineCap = 'round';
        ctx.beginPath(); drawLinePath(ctx, fn, ox, oy, scale, w, h); ctx.stroke();
        ctx.restore();
        ctx.strokeStyle = color; ctx.lineWidth = width;
        ctx.beginPath(); drawLinePath(ctx, fn, ox, oy, scale, w, h); ctx.stroke();
        if (intensity > 0.5) {
            ctx.strokeStyle = `rgba(255, 255, 255, ${intensity * 0.6})`;
            ctx.lineWidth = Math.max(1, width - 1);
            ctx.beginPath(); drawLinePath(ctx, fn, ox, oy, scale, w, h); ctx.stroke();
        }
    } else {
        ctx.strokeStyle = color; ctx.lineWidth = width;
        ctx.beginPath(); drawLinePath(ctx, fn, ox, oy, scale, w, h); ctx.stroke();
    }
}
function drawObstacle(ctx, obs, ox, oy, s) {
    ctx.fillStyle = CONFIG.OBSTACLE_FILL; ctx.strokeStyle = CONFIG.OBSTACLE_STROKE; ctx.lineWidth = 2;
    if (!obs.type || obs.type === 'rect') {
        const p1 = worldToScreen(obs.x1, obs.y2, ox, oy, s);
        const w = (obs.x2 - obs.x1) * s, h = (obs.y2 - obs.y1) * s;
        ctx.fillRect(p1.x, p1.y, w, h); ctx.strokeRect(p1.x, p1.y, w, h);
    } else if (obs.type === 'circle') {
        const p = worldToScreen(obs.x, obs.y, ox, oy, s);
        ctx.beginPath(); ctx.arc(p.x, p.y, (obs.radius || 1) * s, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    } else if (obs.type === 'line') {
        const p1 = worldToScreen(obs.x1, obs.y1, ox, oy, s);
        const p2 = worldToScreen(obs.x2, obs.y2, ox, oy, s);
        ctx.beginPath(); ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y);
        ctx.lineWidth = (obs.thickness || CONFIG.LINE_THICKNESS) * 2 * s;
        ctx.lineCap = 'round'; ctx.stroke();
    }
}
function drawGridBase(ctx, canvas, state) {
    const { scale, offsetX, offsetY, targets, obstacles, tempPoint } = state;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const isDark = darkTheme;
    const gridColor = isDark ? '#1e293b' : CONFIG.GRID_COLOR;
    const axisColor = isDark ? '#475569' : CONFIG.AXIS_COLOR;
    const labelColor = isDark ? '#94a3b8' : CONFIG.LABEL_COLOR;
    const ox = canvas.width / 2 + offsetX, oy = canvas.height / 2 + offsetY;
    let step = 1;
    if (scale < 20) step = 5; if (scale < 10) step = 10;
    if (scale > 80) step = 0.5; if (scale > 160) step = 0.2;
    const pixelStep = step * scale;
    ctx.strokeStyle = gridColor; ctx.lineWidth = 1; ctx.beginPath();
    const sx = ((ox % pixelStep) + pixelStep) % pixelStep;
    for (let x = sx; x < canvas.width; x += pixelStep) { ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); }
    const sy = ((oy % pixelStep) + pixelStep) % pixelStep;
    for (let y = sy; y < canvas.height; y += pixelStep) { ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); }
    ctx.stroke();
    ctx.strokeStyle = axisColor; ctx.lineWidth = 2; ctx.beginPath();
    ctx.moveTo(0, oy); ctx.lineTo(canvas.width, oy);
    ctx.moveTo(ox, 0); ctx.lineTo(ox, canvas.height);
    ctx.stroke();
    ctx.fillStyle = labelColor; ctx.font = '11px sans-serif';
    const minX = -ox / scale, maxX = (canvas.width - ox) / scale;
    const minY = -(canvas.height - oy) / scale, maxY = oy / scale;
    let lS = step; if (pixelStep < 40) lS = step * 2; if (pixelStep < 20) lS = step * 5;
    for (let i = Math.floor(minX / lS) * lS; i <= maxX; i += lS) {
        if (Math.abs(i) < 0.0001) continue;
        const px = ox + i * scale;
        if (px > 0 && px < canvas.width) { ctx.fillRect(px, oy - 3, 1, 6); ctx.fillText(Math.round(i * 100) / 100, px - 10, oy + 16); }
    }
    for (let j = Math.floor(minY / lS) * lS; j <= maxY; j += lS) {
        if (Math.abs(j) < 0.0001) continue;
        const py = oy - j * scale;
        if (py > 0 && py < canvas.height) { ctx.fillRect(ox - 3, py, 6, 1); ctx.fillText(Math.round(j * 100) / 100, ox + 8, py + 4); }
    }
    if (obstacles) obstacles.forEach(o => drawObstacle(ctx, o, ox, oy, scale));
    if (tempPoint) {
        const p = worldToScreen(tempPoint.x, tempPoint.y, ox, oy, scale);
        ctx.fillStyle = getFunctionColor();
        ctx.beginPath(); ctx.arc(p.x, p.y, 6, 0, Math.PI * 2); ctx.fill();
    }
    if (targets && targets.length) {
        targets.forEach((t2, idx) => {
            const p = worldToScreen(t2.x, t2.y, ox, oy, scale);
            ctx.fillStyle = CONFIG.TARGET_FILL; ctx.strokeStyle = CONFIG.TARGET_STROKE; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.arc(p.x, p.y, t2.radius * scale, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
            if (targets.length > 1) {
                ctx.fillStyle = '#065f46'; ctx.font = 'bold 14px sans-serif';
                ctx.textAlign = 'center'; ctx.fillText(idx + 1, p.x, p.y + 5);
                ctx.textAlign = 'start';
            }
        });
    }
}

/* ============================================================
   HANDLERS
============================================================ */
function attachHandlersWithCoords(canvas, container, redraw, scaleRef, offsetRef, getState, tooltipEl, onTapExtra) {
    let dragging = false, lastX = 0, lastY = 0, lastDist = 0;
    let startX = 0, startY = 0, startTime = 0, moved = false;
    let rafId = null;
    const TOL = 8;
    function scheduleRedraw() { if (rafId) return; rafId = requestAnimationFrame(() => { redraw(); rafId = null; }); }
    function getOrigin() { return { ox: canvas.width / 2 + offsetRef.x, oy: canvas.height / 2 + offsetRef.y }; }
    function showCoordTooltip(px, py, worldX, worldY, state) {
        if (!tooltipEl) return;
        let tag = '', tagClass = '', dX = worldX, dY = worldY;
        let onTarget = false;
        (state.targets || []).forEach(t2 => {
            if (Math.hypot(worldX - t2.x, worldY - t2.y) <= t2.radius + 0.15) {
                dX = t2.x; dY = t2.y; tag = '🎯'; tagClass = 'on-target'; onTarget = true;
            }
        });
        if (!onTarget) {
            (state.obstacles || []).forEach(obs => {
                let hit = false;
                if (!obs.type || obs.type === 'rect') hit = worldX >= obs.x1 && worldX <= obs.x2 && worldY >= obs.y1 && worldY <= obs.y2;
                else if (obs.type === 'circle') hit = Math.hypot(worldX - obs.x, worldY - obs.y) <= (obs.radius || 1);
                else if (obs.type === 'line') hit = distanceToSegment(worldX, worldY, obs.x1, obs.y1, obs.x2, obs.y2) <= (obs.thickness || CONFIG.LINE_THICKNESS) + 0.1;
                if (hit) { tag = '🚧'; tagClass = 'on-obstacle'; }
            });
        }
        if (!onTarget && !tag && state.functions && state.functions.length) {
            let bestDist = Infinity, bestPoint = null;
            state.functions.forEach(fn => {
                if (!fn) return;
                const o = getOrigin();
                const sStep = 1 / scaleRef.val, range = 40 / scaleRef.val;
                for (let mx = worldX - range; mx <= worldX + range; mx += sStep) {
                    let my; try { my = fn(mx); } catch (e) { continue; }
                    if (!isFinite(my) || isNaN(my)) continue;
                    const p = worldToScreen(mx, my, o.ox, o.oy, scaleRef.val);
                    const d = Math.hypot(p.x - px, p.y - py);
                    if (d < bestDist) { bestDist = d; bestPoint = { x: mx, y: my }; }
                }
            });
            if (bestPoint && bestDist <= CONFIG.LINE_HIT_RADIUS_PX) {
                dX = bestPoint.x; dY = bestPoint.y; tag = '📈'; tagClass = 'on-line';
            }
        }
        const fmt = v => (Math.abs(Math.round(v * 100) / 100) < 0.001 ? 0 : Math.round(v * 100) / 100).toString();
        tooltipEl.innerHTML = `(${fmt(dX)}; ${fmt(dY)})${tag ? `<span class="coord-tag ${tagClass}">${tag}</span>` : ''}`;
        tooltipEl.style.left = px + 'px';
        tooltipEl.style.top = py + 'px';
        tooltipEl.classList.add('show');
        clearTimeout(tooltipEl._t);
        tooltipEl._t = setTimeout(() => tooltipEl.classList.remove('show'), 3000);
    }
    function handleTap(clientX, clientY) {
        const rect = canvas.getBoundingClientRect();
        const px = clientX - rect.left, py = clientY - rect.top;
        const o = getOrigin();
        const w = screenToWorld(px, py, o.ox, o.oy, scaleRef.val);
        showCoordTooltip(px, py, w.x, w.y, getState());
        if (onTapExtra) onTapExtra(w.x, w.y, px, py);
    }
    canvas.addEventListener('mousedown', e => { startX = e.clientX; startY = e.clientY; startTime = Date.now(); moved = false; dragging = true; lastX = e.clientX; lastY = e.clientY; });
    window.addEventListener('mousemove', e => {
        if (!dragging) return;
        if (Math.abs(e.clientX - startX) > TOL || Math.abs(e.clientY - startY) > TOL) moved = true;
        offsetRef.x += e.clientX - lastX; offsetRef.y += e.clientY - lastY;
        lastX = e.clientX; lastY = e.clientY;
        scheduleRedraw();
    });
    window.addEventListener('mouseup', e => {
        if (dragging && !moved && Date.now() - startTime < 400) handleTap(e.clientX, e.clientY);
        dragging = false;
    });
    canvas.addEventListener('touchstart', e => {
        if (e.touches.length === 1) { const t2 = e.touches[0]; startX = t2.clientX; startY = t2.clientY; startTime = Date.now(); moved = false; dragging = true; lastX = t2.clientX; lastY = t2.clientY; }
        else if (e.touches.length === 2) { dragging = false; moved = true; lastDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY); }
    }, { passive: true });
    canvas.addEventListener('touchmove', e => {
        if (e.touches.length === 1 && dragging) {
            const t2 = e.touches[0];
            if (Math.abs(t2.clientX - startX) > TOL || Math.abs(t2.clientY - startY) > TOL) moved = true;
            offsetRef.x += t2.clientX - lastX; offsetRef.y += t2.clientY - lastY;
            lastX = t2.clientX; lastY = t2.clientY;
            scheduleRedraw();
        } else if (e.touches.length === 2) {
            const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
            if (lastDist > 0) scaleRef.val = Math.max(CONFIG.MIN_SCALE, Math.min(CONFIG.MAX_SCALE, scaleRef.val * (d / lastDist)));
            lastDist = d; scheduleRedraw();
        }
    }, { passive: true });
    canvas.addEventListener('touchend', e => {
        if (e.touches.length === 0) { if (dragging && !moved && Date.now() - startTime < 400) handleTap(startX, startY); dragging = false; lastDist = 0; }
        else if (e.touches.length === 1) { dragging = true; lastX = e.touches[0].clientX; lastY = e.touches[0].clientY; moved = true; }
    }, { passive: true });
    canvas.addEventListener('wheel', e => {
        e.preventDefault();
        scaleRef.val = e.deltaY < 0 ? Math.min(scaleRef.val * CONFIG.ZOOM_STEP, CONFIG.MAX_SCALE) : Math.max(scaleRef.val / CONFIG.ZOOM_STEP, CONFIG.MIN_SCALE);
        scheduleRedraw();
    }, { passive: false });
}

/* ============================================================

let currentTutStep = 0;
function openTutorial() { currentTutStep = 0; renderTutorialStep(); openModal('tutorialModal'); }
function closeTutorial() { closeModal('tutorialModal'); }
function renderTutorialStep() {
    const steps = t('tutSteps');
    const s = steps[currentTutStep];
    document.getElementById('tutTitle').textContent = s.title;
    document.getElementById('tutBody').innerHTML = s.text;
    document.getElementById('tutStepIndicator').textContent = t('tutStep')(currentTutStep + 1, steps.length);
    document.getElementById('tutPrevBtn').style.display = currentTutStep === 0 ? 'none' : 'block';
    document.getElementById('tutNextBtn').textContent = currentTutStep === steps.length - 1 ? t('start') : t('next');
}
function nextTutorialStep() {
    const steps = t('tutSteps');
    if (currentTutStep < steps.length - 1) { currentTutStep++; renderTutorialStep(); }
    else closeTutorial();
}
function prevTutorialStep() { if (currentTutStep > 0) { currentTutStep--; renderTutorialStep(); } }

/* ============================================================
   UNLOCK
============================================================ */
function countCompletedInCategory(cat) {
    const c = levelCategories.find(x => x.className === cat);
    if (!c) return 0;
    return c.levels.filter(l => playerData.completed.includes(l.name)).length;
}
function getUnlockInfo(cat) {
    if (cat === 'easy' || cat === 'custom') return { unlocked: true, done: 0, needed: 0, fromName: '' };
    const rule = CONFIG.UNLOCK[cat];
    const done = countCompletedInCategory(rule.from);
    const names = { easy: t('categoryEasy'), medium: t('categoryMedium'), hard: t('categoryHard') };
    return { unlocked: done >= rule.needed, done, needed: rule.needed, fromName: names[rule.from] || rule.from };
}

/* ============================================================
   NAVIGATION
============================================================ */
function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    if (id === 'levelsScreen') renderLevelsList();
    else if (id === 'expertScreen') renderExpertList();
    else if (id === 'editorMenuScreen') renderCustomLevelsList();
    else if (id === 'gameScreen') { resizeCanvas(); requestAnimationFrame(plotFunction); }
    else if (id === 'freeCalcScreen') { resizeFreeCanvas(); requestAnimationFrame(drawFreeCalculator); }
    else if (id === 'editorScreen') { resizeEditorCanvas(); initEditor(); }
    else if (id === 'shopScreen') renderShop();
    else if (id === 'multiplayerScreen') {
        connectSocket();
        const nick = loadJSON(STORAGE_KEYS.NICK, '');
        const inp = document.getElementById('mpNickname');
        if (inp) inp.value = nick;
    }
    updateCoinDisplays();
}
function goBackFromGame() {
    closeLevelComplete();
    document.getElementById('funcInput').blur();
    document.body.classList.remove('input-focused');
    if (isCustomGame) showScreen('editorMenuScreen');
    else if (currentLevel && currentLevel.name.startsWith('E')) showScreen('expertScreen');
    else showScreen('levelsScreen');
}

const canvas = document.getElementById('canvas');
const container = document.getElementById('graphicsContainer');
const gameScale = { val: CONFIG.DEFAULT_SCALE };
const gameOffset = { x: 0, y: 0 };

function resizeCanvas() {
    const nw = container.clientWidth, nh = container.clientHeight;
    if (Math.abs(nw - canvas.width) < 30 && Math.abs(nh - canvas.height) < 30) return;
    canvas.width = nw; canvas.height = nh;

}

function validateExpert(rawInput) {
    if (!currentLevel) return { ok: true };
    if (currentLevel.maxLen && rawInput.length > currentLevel.maxLen) return { ok: false, msg: `max ${currentLevel.maxLen}` };
    if (currentLevel.forbidden) for (const f of currentLevel.forbidden) if (rawInput.includes(f)) return { ok: false, msg: f };
    if (currentLevel.allowed) {
        const cleaned = rawInput.replace(/\s/g, '');
        const tokens = cleaned.match(/[a-z]+/gi) || [];
        for (const tk of tokens) if (!currentLevel.allowed.includes(tk)) return { ok: false, msg: tk };
    }
    return { ok: true };
}

function plotFunction() {
    if (!currentLevel) return;
    const ox = canvas.width / 2 + gameOffset.x;
    const oy = canvas.height / 2 + gameOffset.y;
    const ctx = canvas.getContext('2d');
    const allTargets = getTargets(currentLevel);
    drawGridBase(ctx, canvas, {
        scale: gameScale.val, offsetX: gameOffset.x, offsetY: gameOffset.y,
        targets: allTargets, obstacles: currentLevel.obstacles || []
    });
    const statusBox = document.getElementById('statusBox');
    const rawInput = document.getElementById('funcInput').value.trim();
    if (!rawInput) {
        statusBox.textContent = t('statusEnter');
        statusBox.className = 'status-box neutral';
        levelJustCompleted = false;
        gameFunctions = [];
        return;
    }
    const ev = validateExpert(rawInput);
    if (!ev.ok) { statusBox.textContent = `🚫 ${ev.msg}`; statusBox.className = 'status-box fail'; gameFunctions = []; return; }
    const fn = compileFunction(rawInput);
    if (!fn) { statusBox.textContent = t('statusSyntaxError'); statusBox.className = 'status-box fail'; levelJustCompleted = false; gameFunctions = []; return; }
    gameFunctions = [fn];
    if (currentSessionKey !== rawInput) { currentSessionKey = rawInput; saveJSON(STORAGE_KEYS.SESSION, { levelName: currentLevel.name, formula: rawInput }); }
    drawFunctionLine(ctx, fn, ox, oy, gameScale.val, getFunctionColor(), getFunctionWidth(), canvas.width, canvas.height);
    const hits = new Array(allTargets.length).fill(false);
    let hitObs = false;
    for (let px = 0; px <= canvas.width; px += CONFIG.HIT_CHECK_STEP) {
        const mx = (px - ox) / gameScale.val;
        let my; try { my = fn(mx); if (isNaN(my) || !isFinite(my)) continue; } catch (e) { continue; }
        allTargets.forEach((t2, i) => { if (Math.hypot(mx - t2.x, my - t2.y) <= t2.radius) hits[i] = true; });
        (currentLevel.obstacles || []).forEach(obs => {
            if (!obs.type || obs.type === 'rect') { if (mx >= obs.x1 && mx <= obs.x2 && my >= obs.y1 && my <= obs.y2) hitObs = true; }
            else if (obs.type === 'circle') { if (Math.hypot(mx - obs.x, my - obs.y) <= (obs.radius || 1)) hitObs = true; }
            else if (obs.type === 'line') { if (distanceToSegment(mx, my, obs.x1, obs.y1, obs.x2, obs.y2) <= (obs.thickness || CONFIG.LINE_THICKNESS)) hitObs = true; }
        });
    }
    const allHit = hits.every(v => v);
    const cnt = hits.filter(v => v).length;
    if (hitObs) { statusBox.textContent = t('statusHitObstacle'); statusBox.className = 'status-box fail'; levelJustCompleted = false; }
    else if (allHit) {
        if (!levelJustCompleted) {
            const res = completeLevel(currentLevel);
            levelJustCompleted = true;
            statusBox.textContent = `${t('statusPassed')} +${res.reward || 0} 🪙`;
            statusBox.className = 'status-box success';
            document.getElementById('funcInput').blur();
            document.body.classList.remove('input-focused');
            victoryAnimStart = Date.now();
            const animate = () => {
                if (victoryAnimStart === null) return;
                const elapsed = Date.now() - victoryAnimStart;
                if (elapsed > CONFIG.VICTORY_DURATION) { victoryAnimStart = null; plotFunction(); return; }
                plotFunction();
                requestAnimationFrame(animate);
            };
            requestAnimationFrame(animate);
            setTimeout(() => showLevelCompleteModal(currentLevel, rawInput, res.reward, res.isFirstTime), CONFIG.VICTORY_DURATION);
        }
    } else if (allTargets.length > 1) {
        statusBox.textContent = t('statusTargetsProgress')(cnt, allTargets.length);
        statusBox.className = 'status-box neutral';
        levelJustCompleted = false;
    } else {
        statusBox.textContent = t('statusGoalMissed');
        statusBox.className = 'status-box neutral';
        levelJustCompleted = false;
    }
}

attachHandlersWithCoords(canvas, container, plotFunction, gameScale, gameOffset,

function getLevelReward(lvl) {
    if (lvl.name.startsWith('E')) return REWARDS.expert;
    if (lvl.name.startsWith('1.')) return REWARDS.easy;
    if (lvl.name.startsWith('2.')) return REWARDS.medium;
    if (lvl.name.startsWith('3.')) return REWARDS.hard;
    return REWARDS.custom;
}
function completeLevel(lvl) {
    const isExpert = lvl.name.startsWith('E');
    const arr = isExpert ? playerData.expertDone : playerData.completed;
    if (arr.includes(lvl.name)) return { reward: 0, isFirstTime: false };
    let reward = getLevelReward(lvl);
    if (activeBonusDouble > 0) { reward *= 2; activeBonusDouble--; saveJSON(STORAGE_KEYS.BONUS_DOUBLE, activeBonusDouble); }
    arr.push(lvl.name);
    playerData.coins += reward;
    playerData.stats.totalEarned += reward;
    playerData.stats.levelsPlayed++;
    if (gameFunctions.length) {
        const raw = document.getElementById('funcInput').value.trim();
        playerData.stats.formulas.push(raw);
        if (playerData.stats.formulas.length > 100) playerData.stats.formulas.shift();
    }
    savePlayer(); updateCoinDisplays(); checkAchievements();
    return { reward, isFirstTime: true };
}

function goToPrevLevel() { if (currentFlatIndex > 0) { currentFlatIndex--; const it = flatLevels[currentFlatIndex]; isCustomGame = it.source === 'custom'; closeLevelComplete(); startLevel(it.level); } }
function goToNextLevel() { if (currentFlatIndex < flatLevels.length - 1) { currentFlatIndex++; const it = flatLevels[currentFlatIndex]; isCustomGame = it.source === 'custom'; closeLevelComplete(); startLevel(it.level); } }

const freeCanvas = document.getElementById('freeCanvas');
const freeContainer = document.getElementById('freeGraphicsContainer');
const freeScale = { val: CONFIG.DEFAULT_SCALE };
const freeOffset = { x: 0, y: 0 };
let freeRows = [];
let activeInput = null;
let freeCompiled = [];
let freeCalcTargetMode = false;
let freeCalcTargets = [];

function resizeFreeCanvas() {
    const nw = freeContainer.clientWidth, nh = freeContainer.clientHeight;
    if (Math.abs(nw - freeCanvas.width) < 30 && Math.abs(nh - freeCanvas.height) < 30) return;
    freeCanvas.width = nw; freeCanvas.height = nh;
    drawFreeCalculator();
}
function addFreeFunctionRow(v = "x^2") {
    const c = document.getElementById('freeFunctionsContainer');
    const id = 'free_row_' + Date.now() + Math.random();
    const d = document.createElement('div');
    d.className = 'input-row'; d.id = id;
    const col = CONFIG.COLORS[freeRows.length % CONFIG.COLORS.length];
    d.innerHTML = `<label style="color:${col};">f(x)=</label>
        <input type="text" value="${v}" oninput="drawFreeCalculator()" onfocus="activeInput=this" autocomplete="off" spellcheck="false">
        <button class="delete-btn" onclick="removeFreeRow('${id}')">×</button>`;
    c.appendChild(d);
    const inp = d.querySelector('input');
    freeRows.push({ id, input: inp, color: col });
    activeInput = inp;
    drawFreeCalculator();
}
function removeFreeRow(id) { document.getElementById(id)?.remove(); freeRows = freeRows.filter(r => r.id !== id); drawFreeCalculator(); }
function drawFreeCalculator() {
    drawGridBase(freeCanvas.getContext('2d'), freeCanvas, { scale: freeScale.val, offsetX: freeOffset.x, offsetY: freeOffset.y, targets: freeCalcTargets, obstacles: null });
    const ox = freeCanvas.width / 2 + freeOffset.x;
    const oy = freeCanvas.height / 2 + freeOffset.y;
    const ctx = freeCanvas.getContext('2d');
    freeCompiled = [];
    freeRows.forEach(row => {
        const fn = compileFunction(row.input.value);
        freeCompiled.push(fn);
        if (!fn) return;
        drawFunctionLine(ctx, fn, ox, oy, freeScale.val, row.color, 3, freeCanvas.width, freeCanvas.height);
    });
    if (freeCalcTargets.length > 0) {
        let hitCount = 0;
        freeCalcTargets.forEach(t2 => {
            let hit = false;
            freeCompiled.forEach(fn => {
                if (!fn) return;
                for (let px = 0; px <= freeCanvas.width; px += 4) {
                    const mx = (px - ox) / freeScale.val;
                    let my; try { my = fn(mx); } catch (e) { continue; }
                    if (isNaN(my) || !isFinite(my)) continue;
                    if (Math.hypot(mx - t2.x, my - t2.y) <= t2.radius) { hit = true; break; }
                }
            });
            if (hit) hitCount++;
        });
        if (hitCount === freeCalcTargets.length && freeCalcTargets.length > 0) {
            showToast(t('toastAllTargetsHit'), 'reward');
            setTimeout(() => { freeCalcTargets = []; drawFreeCalculator(); }, 1500);
        }
    }
}
function toggleFreeCalcMode() {
    freeCalcTargetMode = !freeCalcTargetMode;
    const btn = document.getElementById('freeCalcModeBtn');
    btn.textContent = freeCalcTargetMode ? t('targetsModeOn') : t('targetsModeOff');
    btn.style.background = freeCalcTargetMode ? 'var(--success)' : 'var(--card-bg)';
    btn.style.color = freeCalcTargetMode ? '#fff' : 'var(--text-main)';
    if (!freeCalcTargetMode) { freeCalcTargets = []; drawFreeCalculator(); }
    showToast(freeCalcTargetMode ? t('toastTargetModeOn') : t('toastTargetModeOff'));
}
function freeClearTargets() { freeCalcTargets = []; drawFreeCalculator(); }
attachHandlersWithCoords(freeCanvas, freeContainer, drawFreeCalculator, freeScale, freeOffset,

    (wx, wy) => { if (freeCalcTargetMode) { freeCalcTargets.push({ x: Math.round(wx*10)/10, y: Math.round(wy*10)/10, radius: 0.8 }); drawFreeCalculator(); } }
);
function freeZoomIn() { freeScale.val = Math.min(freeScale.val * CONFIG.ZOOM_STEP, CONFIG.MAX_SCALE); drawFreeCalculator(); }
function freeZoomOut() { freeScale.val = Math.max(freeScale.val / CONFIG.ZOOM_STEP, CONFIG.MIN_SCALE); drawFreeCalculator(); }

function insertToActiveInput(v) {
    if (!activeInput) { if (freeRows.length > 0) activeInput = freeRows[0].input; else return; }
    const s = activeInput.selectionStart, e = activeInput.selectionEnd;
    const tx = activeInput.value;

const editorCanvas = document.getElementById('editorCanvas');
const editorContainer = document.getElementById('editorGraphicsContainer');
const editorScale = { val: CONFIG.DEFAULT_SCALE };
const editorOffset = { x: 0, y: 0 };
let editorTool = 'target';
let editorData = { name: "My Level", target: { x: 3, y: 2, radius: 0.8 }, obstacles: [] };
let lineFirstPoint = null;
let historyStack = [], historyStep = -1;
function resizeEditorCanvas() {
    const nw = editorContainer.clientWidth, nh = editorContainer.clientHeight;
    if (Math.abs(nw - editorCanvas.width) < 30 && Math.abs(nh - editorCanvas.height) < 30) return;
    editorCanvas.width = nw; editorCanvas.height = nh;
    drawEditor();
}
function setEditorTool(tool) {
    editorTool = tool;
    document.querySelectorAll('.tool-btn, [id^="tool"]').forEach(b => b.classList.remove('active'));
    const btn = document.getElementById('tool' + tool.charAt(0).toUpperCase() + tool.slice(1));
    if (btn) btn.classList.add('active');
    lineFirstPoint = null; drawEditor();
}
function pushEditorHistory() { historyStep++; historyStack = historyStack.slice(0, historyStep); historyStack.push(JSON.parse(JSON.stringify(editorData))); }
function editorUndo() { if (historyStep > 0) { historyStep--; editorData = JSON.parse(JSON.stringify(historyStack[historyStep])); drawEditor(); } }
function editorRedo() { if (historyStep < historyStack.length - 1) { historyStep++; editorData = JSON.parse(JSON.stringify(historyStack[historyStep])); drawEditor(); } }
function drawEditor() {
    drawGridBase(editorCanvas.getContext('2d'), editorCanvas, {
        scale: editorScale.val, offsetX: editorOffset.x, offsetY: editorOffset.y,
        targets: editorData.target ? [editorData.target] : [],
        obstacles: editorData.obstacles, tempPoint: lineFirstPoint
    });
}
attachHandlersWithCoords(editorCanvas, editorContainer, drawEditor, editorScale, editorOffset,
    () => ({ targets: editorData.target ? [editorData.target] : [], obstacles: editorData.obstacles, functions: [] }),
    document.getElementById('editorTooltip'),
    (wx, wy) => handleEditorAction(wx, wy)
);
function handleEditorAction(wx, wy) {
    if (editorTool === 'target') { editorData.target = { x: Math.round(wx*10)/10, y: Math.round(wy*10)/10, radius: 0.8 }; pushEditorHistory(); }
    else if (editorTool === 'rect') { editorData.obstacles.push({ type:'rect', x1: Math.round((wx-0.75)*10)/10, x2: Math.round((wx+0.75)*10)/10, y1: Math.round((wy-0.75)*10)/10, y2: Math.round((wy+0.75)*10)/10 }); pushEditorHistory(); }
    else if (editorTool === 'circle') { editorData.obstacles.push({ type:'circle', x: Math.round(wx*10)/10, y: Math.round(wy*10)/10, radius: 1 }); pushEditorHistory(); }
    else if (editorTool === 'line') {
        if (!lineFirstPoint) lineFirstPoint = { x: wx, y: wy };
        else { editorData.obstacles.push({ type:'line', x1: lineFirstPoint.x, y1: lineFirstPoint.y, x2: wx, y2: wy, thickness: CONFIG.LINE_THICKNESS }); lineFirstPoint = null; pushEditorHistory(); }
    }
    else if (editorTool === 'eraser') {
        editorData.obstacles = editorData.obstacles.filter(obs => {
            if (!obs.type || obs.type === 'rect') return !(wx >= obs.x1 && wx <= obs.x2 && wy >= obs.y1 && wy <= obs.y2);
            if (obs.type === 'circle') return Math.hypot(wx - obs.x, wy - obs.y) > (obs.radius || 1);
            if (obs.type === 'line') return distanceToSegment(wx, wy, obs.x1, obs.y1, obs.x2, obs.y2) > (obs.thickness || CONFIG.LINE_THICKNESS) * 2;
            return true;
        });
        pushEditorHistory();
    }
    drawEditor();
}
function initEditor() {
    editorData = { name: "New Level", target: { x: 3, y: 2, radius: 0.8 }, obstacles: [] };
    historyStack = []; historyStep = -1; pushEditorHistory();
    document.getElementById('levelNameInput').value = editorData.name;
    drawEditor();
}
function openNewEditor() { showScreen('editorScreen'); initEditor(); }
document.getElementById('saveEditorBtn').onclick = () => {
    editorData.name = document.getElementById('levelNameInput').value || "Level";
    editorData.hint = "";
    const c = getCustomLevels(); c.push(JSON.parse(JSON.stringify(editorData))); setCustomLevels(c);
    showScreen('editorMenuScreen'); showToast(t('toastLevelSaved')); checkAchievements();
};
document.getElementById('clearEditorBtn').onclick = () => initEditor();
