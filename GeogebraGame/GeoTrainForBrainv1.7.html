let mpState = {
    active: false, role: null, roomId: null, myId: null, opponentId: null,
    players: [], currentRound: 0, currentLevelId: null, currentLevel: null,
    myTime: 0, oppTime: 0, roundStartTime: 0, timerInterval: null,
    scores: {}, totalTimes: {}, opponentFormula: '', opponentSkin: null,
    hitRegistered: false, roundFinished: false, spectators: 0
};

function connectSocket() {
    if (socket && socket.connected) return socket;
    if (typeof io === 'undefined') {
        showToast('❌ Сервер не подключён. Запусти node server.js');
        return null;
    }
    socket = io();
    socket.on('connect', () => {
        mpState.myId = socket.id;
        socket.emit('set_skin', { skin: { id: playerData.equipped.skin, color: getFunctionColor(), width: getFunctionWidth() } });
    });
    socket.on('connect_error', () => showToast('❌ Ошибка соединения с сервером'));
    socket.on('waiting_for_opponent', () => showScreen('matchmakingScreen'));
    socket.on('search_cancelled', () => showScreen('multiplayerScreen'));
    socket.on('room_created', ({ roomId }) => {
        document.getElementById('privateRoomCodeDisplay').textContent = roomId;
        document.getElementById('privateRoomCreate').style.display = 'none';
        document.getElementById('privateRoomWaiting').style.display = 'block';
    });
    socket.on('join_error', ({ msg }) => showToast('❌ ' + msg));
    socket.on('match_start', ({ matchId, levels, players }) => {
        mpState.active = true;
        mpState.role = 'player';
        mpState.players = players;
        mpState.myId = socket.id;
        mpState.opponentId = players.find(p => p.id !== socket.id)?.id;
        mpState.scores = {}; mpState.totalTimes = {};
        players.forEach(p => { mpState.scores[p.id] = 0; mpState.totalTimes[p.id] = 0; });
        const oppName = players.find(p => p.id !== socket.id)?.nickname || 'Соперник';
        document.getElementById('mpOppName').textContent = oppName.toUpperCase();
        document.getElementById('mpMyInput').disabled = false;
        document.getElementById('mpSkipBtn').style.display = 'block';
        document.getElementById('mpSpectatorBadge').style.display = 'none';
        showScreen('mpGameScreen');
        setTimeout(resizeMpCanvas, 100);
    });
    socket.on('opponent_formula', ({ formula }) => {
        mpState.opponentFormula = formula;
        document.getElementById('mpOppInput').value = formula;
        drawMpGraph();
    });
    socket.on('opponent_skin', ({ skin }) => { mpState.opponentSkin = skin; drawMpGraph(); });
    socket.on('round_start', ({ roundNumber, levelId, isExtraRound }) => {
        mpState.currentRound = roundNumber;
        mpState.currentLevelId = levelId;
        mpState.currentLevel = multiplayerLevels[levelId];
        mpState.hitRegistered = false;
        mpState.roundFinished = false;
        mpState.opponentFormula = '';
        mpState.roundStartTime = Date.now();
        document.getElementById('mpRoundInfo').textContent = `Раунд ${roundNumber}${isExtraRound ? ' (доп.)' : '/3'}`;
        document.getElementById('mpMyInput').value = '';
        document.getElementById('mpMyInput').disabled = false;
        document.getElementById('mpOppInput').value = '';
        document.getElementById('mpMyStatus').textContent = '';
        document.getElementById('mpOppStatus').textContent = '';
        document.getElementById('mpStatusBox').textContent = 'Введи формулу';
        document.getElementById('mpStatusBox').className = 'status-box neutral';
        if (mpState.currentLevel) document.getElementById('mpLevelDesc').innerHTML = `<b>${mpState.currentLevel.name}</b> · ${mpState.currentLevel.hint}`;
        document.getElementById('mpSkipBtn').disabled = false;
        document.getElementById('mpSkipBtn').textContent = '⏭️ Пропустить';
        if (mpState.timerInterval) clearInterval(mpState.timerInterval);
        mpState.timerInterval = setInterval(updateMpTimer, 100);
        resizeMpCanvas();
        drawMpGraph();
    });
    socket.on('player_hit_announce', ({ playerId, nickname, timeMs }) => {
        if (playerId === socket.id) document.getElementById('mpMyStatus').innerHTML = `✅ <b>${(timeMs/1000).toFixed(1)}s</b>`;
        else { document.getElementById('mpOppStatus').innerHTML = `✅ <b>${(timeMs/1000).toFixed(1)}s</b>`; showToast(`🔴 ${nickname} попал!`); }
    });
    socket.on('round_end', ({ reason, scores, totalTimes }) => {
        mpState.roundFinished = true;
        mpState.scores = scores; mpState.totalTimes = totalTimes;
        if (mpState.timerInterval) clearInterval(mpState.timerInterval);
        updateMpScores();
        let txt = reason === 'skip' ? '⏭️ Раунд пропущен' : (reason === 'timeout' ? '⏱ Время вышло' : '🏁 Раунд завершён');
        document.getElementById('mpStatusBox').textContent = txt;
        document.getElementById('mpStatusBox').className = 'status-box neutral';
    });
    socket.on('skip_request', ({ fromNickname }) => {
        if (confirm(`⏭️ ${fromNickname} просит пропустить раунд. Согласен?`)) socket.emit('skip_response', { accepted: true });
        else socket.emit('skip_response', { accepted: false });
    });
    socket.on('skip_accepted', ({ byNickname }) => showToast(`⏭️ Раунд пропущен (${byNickname})`, 'reward'));
    socket.on('skip_denied', ({ byNickname, isTimeout }) => showToast(`❌ ${isTimeout ? 'Не ответил' : byNickname + ' отказал'}`, 'fail'));
    socket.on('skip_error', ({ msg }) => showToast('❌ ' + msg));
    socket.on('match_finished', ({ reason, winnerId, isDraw, players, forfeitBy }) => {
        mpState.active = false;
        if (mpState.timerInterval) clearInterval(mpState.timerInterval);
        showMatchResult(winnerId, isDraw, players, reason, forfeitBy);
    });
    socket.on('spectate_state', (data) => {
        mpState.role = 'spectator';
        mpState.players = data.players;
        mpState.myId = 'spectator';
        mpState.currentLevelId = data.level;
        mpState.currentLevel = multiplayerLevels[data.level];
        mpState.currentRound = data.round;
        mpState.scores = data.scores;
        showScreen('mpGameScreen');
        document.getElementById('mpMyInput').disabled = true;
        document.getElementById('mpSkipBtn').style.display = 'none';
        document.getElementById('mpOppName').textContent = (data.players[1]?.nickname || 'Соперник').toUpperCase();
        document.getElementById('mpSpectatorBadge').style.display = 'block';
        document.getElementById('mpSpectatorCount').textContent = '1';
        if (mpState.timerInterval) clearInterval(mpState.timerInterval);
        mpState.timerInterval = setInterval(updateMpTimer, 100);
        setTimeout(resizeMpCanvas, 100);
    });
    socket.on('spectator_joined', ({ count }) => { mpState.spectators = count; document.getElementById('mpSpectatorCount').textContent = count; });
    socket.on('spectator_left', ({ count }) => { mpState.spectators = count; document.getElementById('mpSpectatorCount').textContent = count; });
    socket.on('active_matches', (list) => renderActiveMatches(list));
    socket.on('spectate_error', ({ msg }) => showToast('❌ ' + msg));
    return socket;
}

function openMultiplayer() { connectSocket(); const nick = loadJSON(STORAGE_KEYS.NICK, ''); document.getElementById('mpNickname').value = nick; showScreen('multiplayerScreen'); }
function startMatchmaking() {
    const nick = document.getElementById('mpNickname').value.trim() || 'Игрок';
    saveJSON(STORAGE_KEYS.NICK, nick);
    connectSocket();
    if (socket) socket.emit('find_match', { nickname: nick });
}
function cancelMatchmaking() { if (socket) socket.emit('cancel_search'); showScreen('multiplayerScreen'); }
function openPrivateRoom() {
    const nick = loadJSON(STORAGE_KEYS.NICK, 'Игрок');
    document.getElementById('mpNickname').value = nick;
    document.getElementById('privateRoomCreate').style.display = 'flex';
    document.getElementById('privateRoomWaiting').style.display = 'none';
    document.getElementById('privateRoomCode').value = '';
    showScreen('privateRoomScreen');
}
function createPrivateRoom() {
    const nick = document.getElementById('mpNickname').value.trim() || 'Игрок';
    saveJSON(STORAGE_KEYS.NICK, nick);
    connectSocket();
    if (socket) socket.emit('create_private_room', { nickname: nick });
}
function joinPrivateRoom() {
    const code = document.getElementById('privateRoomCode').value.trim().toUpperCase();
    if (code.length !== 4) { showToast('Код 4 символа'); return; }
    const nick = loadJSON(STORAGE_KEYS.NICK, 'Игрок');
    connectSocket();
    if (socket) socket.emit('join_private_room', { roomId: code, nickname: nick });
}

const mpCanvas = document.getElementById('mpCanvas');
const mpContainer = document.getElementById('mpGraphicsContainer');
const mpScale = { val: CONFIG.DEFAULT_SCALE };
const mpOffset = { x: 0, y: 0 };
function resizeMpCanvas() {
    if (!mpContainer.clientWidth) return;
    mpCanvas.width = mpContainer.clientWidth;
    mpCanvas.height = mpContainer.clientHeight;
    drawMpGraph();
}
function drawMpGraph() {
    if (!mpCanvas || !mpState.currentLevel) return;
    const ctx = mpCanvas.getContext('2d');
    const allTargets = getTargets(mpState.currentLevel);
    drawGridBase(ctx, mpCanvas, { scale: mpScale.val, offsetX: mpOffset.x, offsetY: mpOffset.y, targets: allTargets, obstacles: mpState.currentLevel.obstacles || [] });
    const ox = mpCanvas.width / 2 + mpOffset.x;
    const oy = mpCanvas.height / 2 + mpOffset.y;
    if (mpState.opponentFormula) {
        const oppFn = compileFunction(mpState.opponentFormula);
        if (oppFn) {
            const oppColor = (mpState.opponentSkin && mpState.opponentSkin.color) || '#ef4444';
            const oppWidth = (mpState.opponentSkin && mpState.opponentSkin.width) || 3;
            drawFunctionLine(ctx, oppFn, ox, oy, mpScale.val, oppColor, oppWidth, mpCanvas.width, mpCanvas.height);
        }
    }
    const myInput = document.getElementById('mpMyInput');
    if (myInput && myInput.value && mpState.role === 'player') {
        const myFn = compileFunction(myInput.value);
        if (myFn) drawFunctionLine(ctx, myFn, ox, oy, mpScale.val, getFunctionColor(), getFunctionWidth(), mpCanvas.width, mpCanvas.height);
    }
}
attachHandlersWithCoords(mpCanvas, mpContainer, drawMpGraph, mpScale, mpOffset,
    () => ({
        targets: mpState.currentLevel ? getTargets(mpState.currentLevel) : [],
        obstacles: (mpState.currentLevel && mpState.currentLevel.obstacles) || [],
        functions: (() => {
            const fns = [];
            const oppFn = mpState.opponentFormula ? compileFunction(mpState.opponentFormula) : null;
            if (oppFn) fns.push(oppFn);
            const myInput = document.getElementById('mpMyInput');
            if (myInput && myInput.value && mpState.role === 'player') {
                const myFn = compileFunction(myInput.value);
                if (myFn) fns.push(myFn);
            }
            return fns;
        })()
    }),
    document.getElementById('mpTooltip')
);

document.getElementById('mpMyInput').addEventListener('input', () => {
    if (mpState.role !== 'player' || mpState.roundFinished) return;
    const formula = document.getElementById('mpMyInput').value.trim();
    drawMpGraph();
    if (socket && socket.connected) socket.emit('formula_update', { formula });
    if (!formula || mpState.hitRegistered) return;
    const fn = compileFunction(formula);
    if (!fn) { document.getElementById('mpStatusBox').textContent = t('statusSyntaxError'); document.getElementById('mpStatusBox').className = 'status-box fail'; return; }
    const ox = mpCanvas.width / 2 + mpOffset.x;
    const oy = mpCanvas.height / 2 + mpOffset.y;
    let hitTarget = false, hitObs = false;
    const targets = getTargets(mpState.currentLevel);
    for (let px = 0; px <= mpCanvas.width; px += 2) {
        const mx = (px - ox) / mpScale.val;
        let my; try { my = fn(mx); } catch(e) { continue; }
        if (isNaN(my) || !isFinite(my)) continue;
        targets.forEach(t2 => { if (Math.hypot(mx - t2.x, my - t2.y) <= t2.radius) hitTarget = true; });
        (mpState.currentLevel.obstacles || []).forEach(o => {
            if (!o.type || o.type === 'rect') { if (mx >= o.x1 && mx <= o.x2 && my >= o.y1 && my <= o.y2) hitObs = true; }
            else if (o.type === 'circle') { if (Math.hypot(mx - o.x, my - o.y) <= (o.radius || 1)) hitObs = true; }
            else if (o.type === 'line') { if (distanceToSegment(mx, my, o.x1, o.y1, o.x2, o.y2) <= (o.thickness || CONFIG.LINE_THICKNESS)) hitObs = true; }
        });
    }
    if (hitObs) { document.getElementById('mpStatusBox').textContent = t('statusHitObstacle'); document.getElementById('mpStatusBox').className = 'status-box fail'; return; }
    if (hitTarget && !mpState.hitRegistered) {
        mpState.hitRegistered = true;
        const timeMs = Date.now() - mpState.roundStartTime;
        document.getElementById('mpStatusBox').textContent = `🎉 Попал! ${(timeMs/1000).toFixed(1)}s`;
        document.getElementById('mpStatusBox').className = 'status-box success';
        document.getElementById('mpMyInput').blur();
        if (socket) socket.emit('player_hit', { timeMs });
    }
});
document.getElementById('mpMyInput').addEventListener('focus', () => document.body.classList.add('input-focused'));
document.getElementById('mpMyInput').addEventListener('blur', () => document.body.classList.remove('input-focused'));

function updateMpTimer() {
    if (!mpState.roundStartTime || mpState.roundFinished) return;
    const elapsed = Date.now() - mpState.roundStartTime;
    document.getElementById('mpTimer').textContent = (elapsed / 1000).toFixed(1) + 's';
}
function updateMpScores() {
    const me = mpState.scores[mpState.myId] || 0;
    const opp = mpState.scores[mpState.opponentId] || 0;
    document.getElementById('mpScoreP1').textContent = `Ты: ${me}`;
    document.getElementById('mpScoreP2').textContent = `Соперник: ${opp}`;
}
function requestSkip() {
    if (!socket || mpState.roundFinished) return;
    if (!confirm('⏭️ Запросить пропуск раунда?')) return;
    socket.emit('request_skip');
    document.getElementById('mpSkipBtn').disabled = true;
    document.getElementById('mpSkipBtn').textContent = '⏳ Ожидание...';
}
function forfeitMatch() {
    if (!confirm('🚪 Сдаться?')) return;
    if (socket) socket.emit('forfeit_match');
}
function showMatchResult(winnerId, isDraw, players, reason, forfeitBy) {
    const modal = document.getElementById('matchResultModal');
    const emoji = document.getElementById('matchResultEmoji');
    const title = document.getElementById('matchResultTitle');
    const details = document.getElementById('matchResultDetails');
    const reward = document.getElementById('matchResultReward');
    const me = players.find(p => p.id === mpState.myId);
    const opp = players.find(p => p.id !== mpState.myId);
    const iWon = winnerId === mpState.myId;
    const iLost = forfeitBy === mpState.myId;
    let rewardCoins = 0;
    if (iWon) { emoji.textContent = '🏆'; title.textContent = 'ПОБЕДА!'; title.style.color = 'var(--success)'; rewardCoins = 50; }
    else if (isDraw) { emoji.textContent = '🤝'; title.textContent = 'НИЧЬЯ'; title.style.color = 'var(--gold)'; rewardCoins = 25; }
    else { emoji.textContent = iLost ? '🚪' : '😢'; title.textContent = iLost ? 'СДАЛСЯ' : 'ПОРАЖЕНИЕ'; title.style.color = 'var(--danger)'; rewardCoins = 5; }
    playerData.coins += rewardCoins;
    playerData.stats.totalEarned += rewardCoins;
    reward.innerHTML = `🪙 <b>+${rewardCoins}</b>${rewardCoins === 5 ? ' (утешительно)' : ''}`;
    const myTime = me ? (me.totalTime / 1000).toFixed(1) : '?';
    const oppTime = opp ? (opp.totalTime / 1000).toFixed(1) : '?';
    details.innerHTML = `Ты: ${myTime}s<br>Соперник: ${oppTime}s<br>Раунды: ${me ? me.roundsWon : 0} : ${opp ? opp.roundsWon : 0}`;
    if (me && opp) {
        const history = loadJSON(STORAGE_KEYS.MATCH_HISTORY, []);
        history.unshift({
            date: Date.now(),
            opponent: opp.nickname,
            result: iWon ? 'win' : (isDraw ? 'draw' : 'loss'),
            myTime: me.totalTime, oppTime: opp.totalTime,
            myRounds: me.roundsWon, oppRounds: opp.roundsWon
        });
        if (history.length > 50) history.length = 50;
        saveJSON(STORAGE_KEYS.MATCH_HISTORY, history);
    }
    savePlayer(); updateCoinDisplays(); checkAchievements();
    modal.classList.add('active');
}
function closeMatchResult() {
    document.getElementById('matchResultModal').classList.remove('active');
    if (socket) socket.emit('stop_spectating');
    mpState.active = false;
    showScreen('mainMenu');
}
function playAgain() {
    document.getElementById('matchResultModal').classList.remove('active');
    mpState.active = false;
    startMatchmaking();
}
let currentMatchesTab = 'active';
function openMatches() { showScreen('matchesScreen'); switchMatchesTab('active'); }
function switchMatchesTab(tab) {
    currentMatchesTab = tab;
    ['Active', 'History', 'Stats'].forEach(name => {
        const btn = document.getElementById('tab' + name);
        if (!btn) return;
        const isActive = name.toLowerCase() === tab;
        btn.style.background = isActive ? 'var(--primary)' : '';
        btn.style.color = isActive ? '#fff' : '';
    });
    if (tab === 'active') {
        connectSocket();
        if (socket) socket.emit('get_active_matches');
        document.getElementById('matchesContent').innerHTML = '<p style="color: var(--text-muted); text-align: center;">Загрузка...</p>';
    } else if (tab === 'history') renderMatchHistory();
    else renderMatchStats();
}
function renderActiveMatches(list) {
    const c = document.getElementById('matchesContent');
    if (!list || list.length === 0) { c.innerHTML = '<p style="color: var(--text-muted); text-align: center;">Сейчас никто не играет.</p>'; return; }
    c.innerHTML = list.map(m => `
        <div class="level-card" style="margin-bottom: 10px;">
            <h3>🎮 ${m.players.join(' vs ')}</h3>
            <div class="level-meta"><span>Раунд ${m.round}/3</span><span>${m.level}</span><span>👁 ${m.spectators}</span></div>
            <button class="menu-btn primary" onclick="watchMatch('${m.roomId}')" style="margin-top: 10px; padding: 8px; font-size: 0.85rem; max-width:none;">👁 Смотреть</button>
        </div>
    `).join('');
}
function watchMatch(roomId) { connectSocket(); if (socket) socket.emit('spectate', { roomId }); }
function renderMatchHistory() {
    const history = loadJSON(STORAGE_KEYS.MATCH_HISTORY, []);
    const c = document.getElementById('matchesContent');
    if (history.length === 0) { c.innerHTML = '<p style="color: var(--text-muted); text-align: center;">Матчей пока нет.</p>'; return; }
    c.innerHTML = history.map(m => {
        const emoji = m.result === 'win' ? '✅' : (m.result === 'draw' ? '🤝' : '❌');
        const date = new Date(m.date).toLocaleString();
        return `<div class="level-card" style="margin-bottom: 8px;"><h3>${emoji} ${m.opponent}</h3><div class="level-meta"><span>${date}</span><span>${(m.myTime/1000).toFixed(1)}s / ${(m.oppTime/1000).toFixed(1)}s</span></div></div>`;
    }).join('');
}
function renderMatchStats() {
    const history = loadJSON(STORAGE_KEYS.MATCH_HISTORY, []);
    const wins = history.filter(m => m.result === 'win').length;
    const losses = history.filter(m => m.result === 'loss').length;
    const draws = history.filter(m => m.result === 'draw').length;
    const total = history.length;
    const winrate = total > 0 ? Math.round(wins / total * 100) : 0;
    document.getElementById('matchesContent').innerHTML = `
        <div class="stats-grid">
            <div class="stat-card"><div class="stat-value">${total}</div><div class="stat-label">Матчей</div></div>
            <div class="stat-card"><div class="stat-value" style="color: var(--success);">${wins}</div><div class="stat-label">Побед</div></div>
            <div class="stat-card"><div class="stat-value" style="color: var(--danger);">${losses}</div><div class="stat-label">Поражений</div></div>
            <div class="stat-card"><div class="stat-value" style="color: var(--gold);">${draws}</div><div class="stat-label">Ничьих</div></div>
            <div class="stat-card"><div class="stat-value">${winrate}%</div><div class="stat-label">Винрейт</div></div>
        </div>
    `;
}
